[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logiroute"
version = "0.1.0"
description = "LogiRoute — 电商物流配送路径规划系统（数据结构课程设计）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "earthgrass73" },
]
keywords = ["data-structures", "graph", "logistics", "shortest-path", "course-project"]

# Phase 1 阶段**完全无运行期依赖**：所有核心算法 / 数据结构均手搓实现，
# 仅依赖 Python 标准库（dataclasses / enum / json / unittest / collections / math / pathlib）。
dependencies = []

[project.optional-dependencies]
# 当前没有任何第三方开发依赖；保留分组方便后续（如 black / mypy）按需启用。
dev = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logiroute = ["py.typed", "scenario_generator/road_defaults.json"]
